[package]
name = "linuf"
version = "0.1.0"
edition = "2021"
description = "A playful terminal alphabet-and-sound toy for kids (Swedish phonics + best-effort speech synthesis)"

[dependencies]
# TUI + input. ratatui re-exports crossterm (`ratatui::crossterm`), so we don't
# depend on crossterm separately — that guarantees the versions stay in sync.
ratatui = "0.29"
# Bitmap font for rendering giant colorful glyphs ourselves. We render from
# font8x8 directly (rather than via tui-big-text) so we can fall back to its
# LATIN block for å ä ö — tui-big-text only ever consults the ASCII block.
font8x8 = "0.3"
# Audio playback. Pulls in cpal, which on Linux needs the ALSA dev headers at
# build time (libasound2-dev / alsa-lib-devel — see the README).
rodio = "0.20"
anyhow = "1"
